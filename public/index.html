<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt Rocket 🚀</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="scene"></div>

  <div class="hud tl">
    <div class="label">Prompt Rocket · altitude</div>
    <div class="big"><span id="dist">0 km</span></div>
    <div class="sub"><span id="alt">🌍 Launch pad</span></div>
  </div>
  <div class="hud tr">
    <div class="big"><span id="combo">×0</span></div>
    <div class="sub">combo (tool calls)</div>
  </div>

  <div id="badge" class="badge">READY</div>
  <div id="toast" class="toast"></div>
  <div class="demos">
    <button id="demoBtn" class="btn">Demo launch ▶</button>
    <button class="btn mini" data-demo="iss">🛰 ISS 408 km</button>
    <button class="btn mini" data-demo="starlink">📡 Starlink 550 km</button>
    <button class="btn mini" data-demo="moon">🌙 Moon 384,400 km</button>
    <button class="btn mini" data-demo="mars">🔴 Mars 225M km</button>
  </div>
  <div id="board" class="panel"></div>

  <div id="overlay" class="overlay hidden">
    <div class="sub">Max altitude</div>
    <div class="total"><span id="ovDist">0 km</span></div>
    <div class="new" id="ovZone"></div>
    <div class="new" id="ovNew"></div>
    <button id="againBtn" class="btn static">Again</button>
  </div>

  <script src="/vendor/three.min.js"></script>
  <script src="/voxel.js?v=19"></script>
  <script src="/audio.js?v=19"></script>
  <script src="/app.js?v=19"></script>
</body>
</html>
