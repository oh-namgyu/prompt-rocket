<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>claudeX 🚀</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="scene"></div>

  <div class="hud tl">
    <div class="label">claudeX · 고도</div>
    <div class="big"><span id="dist">0 km</span></div>
    <div class="sub"><span id="alt">🌍 발사대</span></div>
  </div>
  <div class="hud tr">
    <div class="big"><span id="combo">×0</span></div>
    <div class="sub">콤보 (도구 호출)</div>
  </div>

  <div id="badge" class="badge">READY</div>
  <div id="toast" class="toast"></div>
  <div class="demos">
    <button id="demoBtn" class="btn">데모 발사 ▶</button>
    <button class="btn mini" data-demo="iss">🛰 ISS 408km</button>
    <button class="btn mini" data-demo="starlink">📡 스타링크 550km</button>
    <button class="btn mini" data-demo="moon">🌙 달 384,400km</button>
    <button class="btn mini" data-demo="mars">🔴 화성 2.25억km</button>
  </div>
  <div id="board" class="panel"></div>

  <div id="overlay" class="overlay hidden">
    <div class="sub">최고 고도</div>
    <div class="total"><span id="ovDist">0 km</span></div>
    <div class="new" id="ovZone"></div>
    <div class="new" id="ovNew"></div>
    <button id="againBtn" class="btn static">다시</button>
  </div>

  <script src="/vendor/three.min.js"></script>
  <script src="/voxel.js?v=19"></script>
  <script src="/audio.js?v=19"></script>
  <script src="/app.js?v=19"></script>
</body>
</html>
